<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의 평가 — 비즈니스모델과의사결정론</title>
<meta name="description" content="중간 평가 대비 모의 연습. 답안을 쓰고, 채점 기준표로 직접 채점해 봅니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230E1E38'/><path d='M28 52l14 14 30-32' stroke='%23F5F2EC' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{
  --ink:#0E1E38; --ink2:#16233B; --paper:#F5F2EC; --white:#fff;
  --teal:#1C7293; --teal-d:#155A74; --amber:#C2561A; --red:#9B2C2C; --green:#1F6B4A;
  --muted:#5A6677; --line:#DCD6CA; --line2:#EDE8DF;
  --r:14px; --sh:0 1px 2px rgba(14,30,56,.06), 0 8px 24px rgba(14,30,56,.07);
  --ff:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Pretendard',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--paper);color:var(--ink2);line-height:1.65;
  font-size:16px;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:-.01em}
p{margin:0 0 .6em}
ul{margin:.3em 0;padding-left:1.1em}
li{margin:.25em 0}

.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
.screen{display:none}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(245,242,236,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;color:var(--ink);font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand span{display:block}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:0}
.langwrap{position:relative}
.tlink.lang{border:1.5px solid var(--line);border-radius:9px;padding:5px 11px;background:#fff}
.tlink.lang:after{content:"";display:inline-block;margin-left:6px;border:4px solid transparent;
  border-top-color:var(--teal);transform:translateY(2px)}
.langlist{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;
  border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh);overflow:hidden;min-width:124px;z-index:60}
.langwrap.open .langlist{display:block}
.langopt{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 14px;
  font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.langopt:hover{background:var(--paper)}
.langopt.cur{color:var(--teal);font-weight:800;background:#F2F8FA}
.top-sp{flex:1}
.tlink{background:none;border:0;color:var(--teal);font-weight:700;font-size:13.5px;cursor:pointer;
  padding:6px 10px;border-radius:9px}
.tlink:hover{background:rgba(28,114,147,.09)}
.savetag{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* ---- buttons ---- */
.btn{border:0;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer;
  transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:15px}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 2px 0 rgba(14,30,56,.25)}
.btn.primary:hover{background:#15274a;transform:translateY(-1px)}
.btn.primary:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:rgba(14,30,56,.04)}
.btn.g{background:#fff;color:#1f1f1f;border:1.5px solid var(--line);width:100%}
.btn.g:hover{background:#fafafa;border-color:#bbb}
.btn.block{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.actions .btn{flex:1 1 auto;min-width:140px}

/* ---- auth ---- */
.auth{max-width:420px;margin:7vh auto 0;padding:0 16px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:var(--sh)}
.auth h1{font-size:23px;color:var(--ink);margin-bottom:6px}
.auth-sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.tabs{display:flex;background:var(--paper);border-radius:11px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:0;padding:9px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer;font-size:14.5px}
.tabs button.act{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.field input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,114,147,.12)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.msg{color:var(--red);font-size:13.5px;margin-top:10px;min-height:19px;font-weight:600}
.gicon{width:17px;height:17px;flex:0 0 17px}

/* ---- home ---- */
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:26px 24px;margin:22px 0 18px;
  box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;
  background:rgba(28,114,147,.26)}
.hero h1{font-size:21px;margin-bottom:5px;position:relative}
.hero .hsub{color:rgba(255,255,255,.72);font-size:13.5px;position:relative;margin-bottom:18px}
.hstats{display:flex;gap:22px;position:relative;flex-wrap:wrap}
.hstat .v{font-size:27px;font-weight:800;letter-spacing:-.02em}
.hstat .l{font-size:12px;color:rgba(255,255,255,.65)}
.prog{height:7px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:16px 0 7px;position:relative}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#2C92BA,#58C4D8);border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.progtxt{font-size:12.5px;color:rgba(255,255,255,.7);position:relative}

.howto{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:20px}
.howto h3{font-size:15px;color:var(--ink);margin-bottom:10px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st3{background:var(--paper);border-radius:11px;padding:13px 13px 14px}
.st3 b{display:block;font-size:11.5px;color:var(--teal);font-weight:800;margin-bottom:3px}
.st3 span{font-size:13px;color:var(--ink2);font-weight:600;display:block;line-height:1.45}

h2.sect{font-size:16px;color:var(--ink);margin:26px 0 12px;display:flex;align-items:center;gap:9px}
h2.sect:after{content:"";flex:1;height:1px;background:var(--line)}

#qGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.qcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  cursor:pointer;transition:.16s;display:block;width:100%}
.qcard:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh)}
.qcard-n{font-size:11.5px;font-weight:800;color:var(--teal);letter-spacing:.03em}
.qcard-t{font-size:16px;font-weight:800;color:var(--ink);margin:2px 0 1px;letter-spacing:-.01em}
.qcard-o{font-size:13px;color:var(--muted);margin-bottom:11px}
.qcard-s{font-size:11.5px;color:#8A94A3;margin-top:9px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--line2);color:var(--muted)}
.pill.ok{background:#E3F0EA;color:var(--green)}
.pill.mid{background:#FAEEE2;color:var(--amber)}

/* ---- exam ---- */
.exhead{margin:20px 0 14px}
.exhead h1{font-size:21px;color:var(--ink)}
.exmeta{font-size:13px;color:var(--muted);margin-top:3px}
#exNav{display:flex;gap:7px;margin:16px 0 12px;flex-wrap:wrap}
.navdot{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font-weight:800;color:var(--muted);cursor:pointer;font-size:14px}
.navdot:hover{border-color:var(--ink)}
.navdot.fin{background:#E3F0EA;border-color:#B7D8C8;color:var(--green)}
.navdot.cur{background:var(--ink);border-color:var(--ink);color:#fff}
#exStage{display:flex;align-items:center;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.stp{font-size:12px;font-weight:700;color:#A3ACB9;padding:4px 9px;border-radius:8px;background:var(--line2)}
.stp.cur{background:var(--teal);color:#fff}
.stp.done{background:#E3F0EA;color:var(--green)}
.stp-sep{width:11px;height:1.5px;background:var(--line)}

.sitbox{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ink);
  border-radius:12px;padding:18px 20px;margin-bottom:22px}
.sitlab{font-size:11.5px;font-weight:800;color:var(--ink);letter-spacing:.06em;margin-bottom:8px}
.sitbox p{font-size:15px;line-height:1.72}
.sitbox p:last-child{margin-bottom:0}

.dt{width:100%;border-collapse:collapse;margin:14px 0 2px;font-size:14px}
.dt th{background:var(--ink);color:#fff;text-align:left;padding:9px 11px;font-weight:700;font-size:13px}
.dt td{padding:8px 11px;border-bottom:1px solid var(--line2)}
.dt tbody tr:nth-child(odd){background:#FAF8F4}
.dt td.num,.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.dt.wide{font-size:13px}
.dt.wide th,.dt.wide td{padding:7px 8px}

.sub{margin-bottom:26px}
.sub-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sub-n{font-weight:800;color:var(--ink);flex:0 0 auto}
.sub-q{flex:1 1 240px;font-size:15.5px;line-height:1.68;font-weight:600}
.sub-p{font-size:12.5px;font-weight:800;color:var(--amber);white-space:nowrap;flex:0 0 auto}
.sub-g{font-size:12px;color:var(--muted);margin:5px 0 8px}
.ta{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  line-height:1.72;resize:vertical;min-height:130px}
.ta:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px rgba(28,114,147,.1)}
.ta-c{font-size:11.5px;color:var(--muted);text-align:right;margin-top:4px}
.ta-c.low{color:var(--amber);font-weight:700}

.note{border-radius:12px;padding:14px 17px;font-size:14px;line-height:1.68;margin-bottom:20px}
.note.amber{background:#FBF3EA;border:1px solid #EAD4BB;color:#6B3A14}
.note.teal{background:#EEF5F8;border:1px solid #C6DEE8;color:#13475C}
.note.red{background:#FCF2F2;border:1px solid #E8CBCB;color:#7A2222}
.note.ink{background:#fff;border:1px solid var(--line);border-left:5px solid var(--teal)}
.note.small{font-size:13px;padding:11px 14px}

.autolist{display:flex;flex-direction:column;gap:9px}
.auto{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.auto-i{flex:0 0 46px;height:23px;border-radius:7px;font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-top:2px}
.auto.good{border-color:#C3DED0}.auto.good .auto-i{background:#E3F0EA;color:var(--green)}
.auto.warn{border-color:#EAD4BB}.auto.warn .auto-i{background:#FAEEE2;color:var(--amber)}
.auto.bad{border-color:#E8CBCB}.auto.bad .auto-i{background:#FCE9E9;color:var(--red)}
.auto-t{font-weight:800;font-size:14.5px;color:var(--ink)}
.auto-d{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:2px}

.gsub{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 18px;margin-bottom:16px}
.gsub-h{font-weight:800;color:var(--ink);font-size:14.5px;line-height:1.6;margin-bottom:11px;
  display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.gsub-h>span:first-child{flex:1 1 auto}
.myans{margin:10px 0}
.myans summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--teal);outline:0}
.myans pre{white-space:pre-wrap;font-family:inherit;font-size:13.5px;background:var(--paper);
  border-radius:10px;padding:12px 14px;margin:8px 0 0;color:var(--ink2);line-height:1.7}
.gate{background:#FCF2F2;border:1px solid #E8CBCB;color:#7A2222;font-size:13px;font-weight:700;
  border-radius:9px;padding:9px 12px;margin-bottom:11px}

.el{margin:13px 0}
.el-n{font-size:13px;font-weight:800;color:var(--teal);margin-bottom:6px}
.opt,.pen{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line2);border-radius:10px;
  padding:9px 12px;margin-bottom:5px;cursor:pointer;transition:.13s;background:#FDFCFA}
.opt:hover,.pen:hover{border-color:var(--teal);background:#fff}
.opt.sel{border-color:var(--teal);background:#F2F8FA;box-shadow:inset 0 0 0 1px var(--teal)}
.pen.sel{border-color:var(--red);background:#FCF4F4;box-shadow:inset 0 0 0 1px var(--red)}
.opt input,.pen input{margin:5px 0 0;flex:0 0 auto;accent-color:var(--teal)}
.pen input{accent-color:var(--red)}
.opt-p{flex:0 0 42px;font-weight:800;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.opt-p.neg{color:var(--red)}
.opt-c{flex:1;font-size:13.5px;line-height:1.6}
.pen.big{margin-top:18px;padding:13px 15px}

.livebox{position:sticky;bottom:12px;background:var(--ink);color:#fff;border-radius:13px;
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 8px 28px rgba(14,30,56,.28);margin-top:20px}
.live-l{font-size:12.5px;color:rgba(255,255,255,.7)}
.live-v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-left:auto}
.live-s{font-size:12px;width:100%;color:rgba(255,255,255,.62)}
.live-s.warn{color:#F0B37E}.live-s.ok{color:#8FD6B4}

.scorehero{background:var(--ink);color:#fff;border-radius:16px;padding:24px;margin-bottom:20px;text-align:center}
.sh-l{font-size:12.5px;color:rgba(255,255,255,.66)}
.sh-v{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 12px}
.sh-v span{font-size:17px;font-weight:700;color:rgba(255,255,255,.6);margin-left:6px;letter-spacing:0}
.sh-b{height:8px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-bottom:12px}
.sh-b i{display:block;height:100%;background:linear-gradient(90deg,#2C92BA,#58C4D8);border-radius:99px;
  animation:grow .8s cubic-bezier(.3,1,.4,1)}
@keyframes grow{from{width:0 !important}}
.sh-s{font-size:14px;color:rgba(255,255,255,.85);line-height:1.6}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}
.col{border-radius:11px;padding:13px 15px;font-size:13.5px}
.col.ok{background:#F1F7F4;border:1px solid #C9E0D4}
.col.no{background:#FBF4F4;border:1px solid #E6CFCF}
.col-h{font-weight:800;font-size:12.5px;margin-bottom:7px;letter-spacing:.01em}
.col.ok .col-h{color:var(--green)}.col.no .col-h{color:var(--red)}
.col ul{padding-left:1em;margin:0}
.col li{line-height:1.6;margin:.3em 0}

/* ---- report ---- */
.bar{display:grid;grid-template-columns:1fr 140px 62px;gap:11px;align-items:center;margin-bottom:9px}
.bar-l{font-size:13.5px;font-weight:600}
.bar-t{height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:99px;transition:width .6s}
.bar-t i.hi{background:var(--green)}.bar-t i.mid{background:var(--amber)}.bar-t i.lo{background:var(--red)}
.bar-v{font-size:13px;font-weight:800;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.prin{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:8px}
.prin-n{flex:0 0 52px;font-size:12px;font-weight:800;color:var(--teal)}
.prin-t{font-weight:800;font-size:14.5px;color:var(--ink)}
.prin-d{font-size:13.5px;color:var(--muted);line-height:1.62;margin-top:2px}
.pfstat{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 17px;margin-bottom:14px;font-size:13.5px;color:var(--muted)}
.pfstat b{color:var(--ink);font-size:16px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.fine{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.loadbox{text-align:center;padding:16vh 20px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;transition:.26s;z-index:90;
  max-width:88vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red)}

.modal{position:fixed;inset:0;background:rgba(14,30,56,.55);display:none;z-index:80;
  align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-in{background:var(--paper);border-radius:16px;max-width:620px;width:100%;max-height:82vh;
  overflow-y:auto;padding:24px}
.modal-h{display:flex;align-items:center;margin-bottom:14px}
.modal-h h2{font-size:18px;color:var(--ink);flex:1}
.xbtn{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}

@media (max-width:620px){
  body{font-size:15.5px}
  #qGrid,.steps3,.twocol{grid-template-columns:1fr}
  .bar{grid-template-columns:1fr 60px;gap:8px}
  .bar-t{display:none}
  .hero,.scorehero{padding:20px 18px}
  .sh-v{font-size:38px}
  .actions .btn{flex:1 1 100%}
  .auth{margin-top:3vh}
  .auth-card{padding:24px 20px}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="brand"><span data-t="brand.t">모의 평가</span><small data-t="brand.s">비즈니스모델과의사결정론</small></div>
    <div class="top-sp"></div>
    <div class="langwrap" id="langWrap"><button class="tlink lang" id="langBtn">한국어</button><div class="langlist" id="langList"></div></div>
    <button class="tlink" id="topHome" data-t="nav.home" style="display:none">홈</button>
    <span class="savetag" id="saveTag"></span>
    <button class="tlink" id="btnPrin" data-t="nav.prin">채점 원칙</button>
  </div>
</div>

<!-- ===== 로그인 ===== -->
<section class="screen on" id="scAuth">
  <div class="auth">
    <div class="auth-card">
      <h1 data-t="auth.h1">중간 평가 모의 연습</h1>
      <p class="auth-sub" data-t="auth.sub"></p>
      <div class="tabs"><button id="tabLogin" class="act" data-t="auth.login">로그인</button><button id="tabJoin" data-t="auth.join">회원가입</button></div>
      <div id="joinFields" style="display:none">
        <div class="field"><label data-t="auth.name"></label><input id="inName" type="text" data-tph="auth.nameph" autocomplete="name"></div>
        <div class="field"><label data-t="auth.sno"></label><input id="inSno" type="text" data-tph="auth.snoph" inputmode="numeric" autocomplete="off"></div>

</script>
<script>
/* ===== 상태 ===== */
const PROF_EMAILS = ["gt4065b@wsu.ac.kr"];
let ME = null;            // {uid, email, name, studentNo}
let STATE = {};           // qid -> {answers, stage, auto, self, pen, common, score, done}
let CUR = 0;
let SAVE_TIMER = null;
let LANG = "ko";

const TRS = { ko: {}, en: TR_EN, zh: TR_ZH };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===== 다국어 ===== */
function U(key, vars) {
  let s = (UI[LANG] && UI[LANG][key]) || UI.ko[key] || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
/* 문항 내용: 번역이 없으면 한국어 원문으로 */
function C(path, fallback) {
  const t = TRS[LANG] && TRS[LANG][path];
  return (t === undefined || t === null || t === "") ? fallback : t;
}
const pat = () => PAT[LANG] || PAT.ko;
const prins = () => PRIN_TR[LANG] || PRIN_TR.ko;

function setLang(l, rerender) {
  LANG = l;
  try { localStorage.setItem("mockexam.lang", l); } catch (e) {}
  document.documentElement.lang = l === "zh" ? "zh-CN" : l;
  paintStatic();
  renderLangMenu();
  if (rerender) {
    const on = $(".screen.on");
    const id = on ? on.id : "";
    if (id === "scHome") renderHome();
    else if (id === "scExam") renderQuestion();
    else if (id === "scReport") renderReport();
    else if (id === "scProf") renderProf();
    if (ME) queueSave();
  }
}

/* data-t / data-tph 속성을 가진 정적 문구 치환 */
function paintStatic() {
  $$("[data-t]").forEach(el => { el.textContent = U(el.dataset.t); });
  $$("[data-tph]").forEach(el => { el.placeholder = U(el.dataset.tph); });
  document.title = U("brand.t") + " — " + U("brand.s");
  setAuthTab($("#btnEmail").dataset.mode || "login");
}

function renderLangMenu() {
  $("#langBtn").textContent = LANGS.find(l => l.id === LANG).label;
  $("#langList").innerHTML = LANGS.map(l =>
    '<button class="langopt' + (l.id === LANG ? " cur" : "") + '" data-l="' + l.id + '">' + l.label + "</button>"
  ).join("");
  $$("#langList .langopt").forEach(b => b.onclick = () => {
    $("#langWrap").classList.remove("open");
    if (b.dataset.l !== LANG) setLang(b.dataset.l, true);
  });
}

/* ===== 화면 ===== */
function show(id) {
  $$(".screen").forEach(s => s.classList.remove("on"));
  $("#" + id).classList.add("on");
  window.scrollTo({ top: 0, behavior: "instant" });
}
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = "toast", 2600);
}

function blankState() {
  const o = {};
  QUESTIONS.forEach(q => {
    o[q.id] = { answers: {}, stage: 0, auto: null, self: {}, pen: {}, common: false, score: null, done: false };
    q.subs.forEach(s => o[q.id].answers[s.id] = "");
  });
  return o;
}

/* ===== 로그인 ===== */
function authError(e) {
  const m = {
    "auth/invalid-email": "err.email", "auth/user-not-found": "err.nouser",
    "auth/wrong-password": "err.pw", "auth/invalid-credential": "err.pw",
    "auth/email-already-in-use": "err.dup", "auth/weak-password": "err.weak",
    "auth/popup-closed-by-user": "err.popup", "auth/popup-blocked": "err.blocked",
    "auth/network-request-failed": "err.net", "auth/too-many-requests": "err.many"
  };
  if (e && m[e.code]) return U(m[e.code]);
  if (e && e.uiKey) return U(e.uiKey);
  return U("err.etc");
}

function setAuthTab(mode) {
  $("#tabLogin").classList.toggle("act", mode === "login");
  $("#tabJoin").classList.toggle("act", mode === "join");
  $("#joinFields").style.display = mode === "join" ? "block" : "none";
  $("#btnEmail").textContent = mode === "join" ? U("auth.joinbtn") : U("auth.login");
  $("#btnEmail").dataset.mode = mode;
}

async function doEmailAuth() {
  const mode = $("#btnEmail").dataset.mode;
  const email = $("#inEmail").value.trim(), pw = $("#inPw").value;
  if (!email || !pw) return ($("#authMsg").textContent = U("auth.need"));
  const btn = $("#btnEmail"); btn.disabled = true; btn.textContent = U("auth.wait");
  $("#authMsg").textContent = "";
  try {
    if (mode === "join") {
      const name = $("#inName").value.trim(), sno = $("#inSno").value.trim();
      if (!name || !sno) throw { uiKey: "auth.needname" };
      const cred = await auth.createUserWithEmailAndPassword(email, pw);
      await cred.user.updateProfile({ displayName: name });
      await db.ref("mockexam/users/" + cred.user.uid).update({ name, studentNo: sno, email, joinedAt: Date.now() });
    } else {
      await auth.signInWithEmailAndPassword(email, pw);
    }
  } catch (e) {
    $("#authMsg").textContent = authError(e);
  } finally {
    btn.disabled = false; setAuthTab(mode);
  }
}

async function doGoogle() {
  try {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    await auth.signInWithPopup(p);
  } catch (e) { $("#authMsg").textContent = authError(e); }
}

async function ensureProfile(user) {
  const snap = await db.ref("mockexam/users/" + user.uid).get();
  const v = snap.val() || {};
  if (!v.studentNo) {
    show("scProfile");
    $("#pfName").value = v.name || user.displayName || "";
    return new Promise(res => {
      $("#btnProfile").onclick = async () => {
        const name = $("#pfName").value.trim(), sno = $("#pfSno").value.trim();
        if (!name || !sno) return ($("#pfMsg").textContent = U("pf.need"));
        await db.ref("mockexam/users/" + user.uid).update({
          name, studentNo: sno, email: user.email, joinedAt: v.joinedAt || Date.now()
        });
        res({ name, studentNo: sno });
      };
    });
  }
  return { name: v.name || user.displayName || "", studentNo: v.studentNo };
}

/* ===== 저장 ===== */
async function loadProgress() {
  const snap = await db.ref("mockexam/attempts/" + ME.uid).get();
  const v = snap.val();
  STATE = blankState();
  if (v && v.state) {
    QUESTIONS.forEach(q => {
      const s = v.state[q.id]; if (!s) return;
      const t = STATE[q.id];
      t.stage = s.stage || 0; t.done = !!s.done;
      t.score = (s.score === undefined ? null : s.score);
      t.common = !!s.common; t.self = s.self || {}; t.pen = s.pen || {}; t.auto = s.auto || null;
      q.subs.forEach(sub => t.answers[sub.id] = (s.answers && s.answers[sub.id]) || "");
    });
  }
  if (v && v.lang && TRS[v.lang]) setLang(v.lang, false);
}

function queueSave() {
  clearTimeout(SAVE_TIMER);
  $("#saveTag").textContent = U("save.ing");
  SAVE_TIMER = setTimeout(saveNow, 900);
}

async function saveNow() {
  if (!ME) return;
  try {
    await db.ref("mockexam/attempts/" + ME.uid).update({
      name: ME.name, studentNo: ME.studentNo, email: ME.email, lang: LANG,
      updatedAt: Date.now(), state: STATE, total: totalScore(), doneCount: doneCount()
    });
    $("#saveTag").textContent = U("save.ok", { t: new Date().toLocaleTimeString(LANG === "ko" ? "ko-KR" : LANG === "zh" ? "zh-CN" : "en-US", { hour: "2-digit", minute: "2-digit" }) });
  } catch (e) {
    $("#saveTag").textContent = U("save.fail");
  }
}

const doneCount = () => QUESTIONS.filter(q => STATE[q.id].done).length;
const totalScore = () => QUESTIONS.reduce((a, q) => a + (STATE[q.id].score || 0), 0);

/* ===== 자동 1차 점검 ===== */
function runAuto(q) {
  const P = pat();
  const found = { ban: [], cases: [], vague: [] };
  let hasNum = false, hasActor = false, hasCond = false;
  const shortSubs = [];

  q.subs.forEach((sub, si) => {
    const t = STATE[q.id].answers[sub.id] || "";
    const n = t.replace(/\s/g, "").length;
    if (n < 20) shortSubs.push("(" + (si + 1) + ")");
    P.ban.forEach(p => { if (t.toLowerCase().includes(p.toLowerCase()) && !found.ban.includes(p)) found.ban.push(p); });
    CASE_TERMS.forEach(p => { if (t.includes(p) && !found.cases.includes(p)) found.cases.push(p); });
    if (sub.check && sub.check.warnVaguePoint) {
      const m = t.match(P.vague);
      if (m && !found.vague.includes(m[0])) found.vague.push(m[0]);
    }
    if (P.num.test(t)) hasNum = true;
    if (P.actor.test(t)) hasActor = true;
    if (P.cond.test(t)) hasCond = true;
  });

  const items = [];
  if (shortSubs.length) items.push({ lv: "bad", k: "au.short", x: shortSubs.join(", ") });
  if (found.ban.length) items.push({ lv: "bad", k: "au.ban", x: found.ban.join("”, “") });
  else items.push({ lv: "good", k: "au.noban" });
  if (found.cases.length) items.push({ lv: "warn", k: "au.case", x: found.cases.join("”, “") });
  if (found.vague.length) items.push({ lv: "bad", k: "au.vague", x: found.vague.join("”, “") });

  if (q.subs.some(s => s.check && s.check.needNum)) items.push(hasNum ? { lv: "good", k: "au.num1" } : { lv: "bad", k: "au.num0" });
  if (q.subs.some(s => s.check && s.check.needActor)) items.push(hasActor ? { lv: "good", k: "au.act1" } : { lv: "warn", k: "au.act0" });
  if (q.id === "q1" || q.id === "q3" || q.id === "q4") items.push(hasCond ? { lv: "good", k: "au.cond1" } : { lv: "warn", k: "au.cond0" });

  return { items, at: Date.now() };
}

/* ===== 홈 ===== */
function renderHome() {
  $("#meName").textContent = ME.name;
  $("#meSub").textContent = ME.studentNo + " · " + ME.email;
  const dc = doneCount();
  $("#homeProgress").style.width = (dc / QUESTIONS.length * 100) + "%";
  $("#homeProgressTxt").textContent = U("home.prog", { a: dc, b: QUESTIONS.length });
  $("#homeScore").textContent = dc ? totalScore() + "" : "—";
  $("#homeScoreSub").textContent = dc ? U("home.scoresub", { n: dc }) : U("home.noscore");

  $("#qGrid").innerHTML = QUESTIONS.map((q, i) => {
    const s = STATE[q.id];
    const written = q.subs.filter(sub => (s.answers[sub.id] || "").trim().length > 10).length;
    const badge = s.done
      ? '<span class="pill ok">' + U("card.done", { n: s.score }) + "</span>"
      : (written ? '<span class="pill mid">' + U("card.writing", { a: written, b: q.subs.length }) + "</span>"
                 : '<span class="pill">' + U("card.before") + "</span>");
    return '<button class="qcard" data-i="' + i + '">'
      + '<div class="qcard-n">' + U("q.label", { n: q.no }) + "</div>"
      + '<div class="qcard-t">' + esc(C(q.id + ".title", q.title)) + "</div>"
      + '<div class="qcard-o">' + esc(C(q.id + ".org", q.org)) + "</div>"
      + '<div class="qcard-b">' + badge + "</div>"
      + '<div class="qcard-s">' + esc(C(q.id + ".scope", q.scope)) + "</div></button>";
  }).join("");
  $$("#qGrid .qcard").forEach(b => b.onclick = () => openQuestion(+b.dataset.i));

  $("#btnReport").style.display = dc ? "inline-flex" : "none";
  $("#profLink").style.display = PROF_EMAILS.includes((ME.email || "").toLowerCase()) ? "inline-flex" : "none";
}

/* ===== 문항 ===== */
function openQuestion(i) { CUR = i; renderQuestion(); show("scExam"); }

function renderQuestion() {
  const q = QUESTIONS[CUR], s = STATE[q.id];

  $("#exNav").innerHTML = QUESTIONS.map((x, i) =>
    '<button class="navdot' + (i === CUR ? " cur" : "") + (STATE[x.id].done ? " fin" : "") + '" data-i="' + i + '">' + x.no + "</button>"
  ).join("");
  $$("#exNav .navdot").forEach(b => b.onclick = () => openQuestion(+b.dataset.i));

  $("#exStage").innerHTML = [0, 1, 2, 3].map(i =>
    '<span class="stp' + (i === s.stage ? " cur" : (i < s.stage ? " done" : "")) + '">' + U("stage." + i) + "</span>"
  ).join('<span class="stp-sep"></span>');

  $("#exTitle").textContent = qLabel(q) + ". " + C(q.id + ".title", q.title);
  $("#exMeta").textContent = C(q.id + ".org", q.org) + " · " + C(q.id + ".scope", q.scope) + " · " + U("ex.pts", { n: 20 });

  const body = $("#exBody");
  body.innerHTML = s.stage === 0 ? viewWrite(q, s) : s.stage === 1 ? viewAuto(q, s) : s.stage === 2 ? viewSelf(q, s) : viewExplain(q, s);
  bindStage(q, s);
}

function qLabel(q) { return U("q.label", { n: q.no }); }
const subPrompt = (q, sub) => C(q.id + "." + sub.id + ".prompt", sub.prompt);
const subBase = (q, sub) => q.id + "." + sub.id;

/* --- 0단계 --- */
function viewWrite(q, s) {
  let h = '<div class="sitbox"><div class="sitlab">' + U("ex.sit") + "</div>"
    + q.situation.map((p, i) => "<p>" + esc(C(q.id + ".sit." + i, p)) + "</p>").join("");
  if (q.table) {
    h += '<table class="dt"><thead><tr>' + q.table.head.map((c, i) => "<th>" + esc(C(q.id + ".th." + i, c)) + "</th>").join("") + "</tr></thead><tbody>"
      + q.table.rows.map((r, ri) => "<tr>" + r.map((c, ci) =>
          "<td" + (ci ? ' class="num"' : "") + ">" + esc(ci === 0 ? C(q.id + ".tc." + ri, c) : c) + "</td>").join("") + "</tr>").join("")
      + "</tbody></table>";
  }
  h += "</div>";

  q.subs.forEach((sub, i) => {
    h += '<div class="sub">'
      + '<div class="sub-h"><span class="sub-n">(' + (i + 1) + ')</span>'
      + '<span class="sub-q">' + esc(subPrompt(q, sub)) + "</span>"
      + '<span class="sub-p">' + U("ex.pts", { n: sub.points }) + "</span></div>"
      + '<div class="sub-g">' + U("ex.guide") + " · " + esc(C(subBase(q, sub) + ".guide", sub.guide)) + "</div>"
      + '<textarea class="ta" data-sub="' + sub.id + '" rows="7" placeholder="' + U("ex.ph") + '">' + esc(s.answers[sub.id] || "") + "</textarea>"
      + '<div class="ta-c" data-cnt="' + sub.id + '"></div></div>';
  });

  h += '<div class="actions"><button class="btn ghost" id="btnHome2">' + U("ex.tohome") + "</button>"
    + '<button class="btn primary" id="btnSubmit">' + U("ex.submit") + "</button></div>"
    + '<p class="fine">' + U("ex.fine") + "</p>";
  return h;
}

/* --- 1단계 --- */
function viewAuto(q, s) {
  const a = s.auto || runAuto(q);
  let h = '<div class="note amber">' + U("au.notice") + "</div>";
  h += '<div class="autolist">' + a.items.map(it => {
    const label = U("au." + (it.lv === "good" ? "good" : it.lv === "warn" ? "warn" : "bad"));
    return '<div class="auto ' + it.lv + '"><div class="auto-i">' + label + "</div>"
      + '<div><div class="auto-t">' + esc(U(it.k + ".t")) + "</div>"
      + '<div class="auto-d">' + esc(U(it.k + ".d", { x: it.x || "" })) + "</div></div></div>";
  }).join("") + "</div>";
  h += '<div class="actions"><button class="btn ghost" id="btnBack0">' + U("au.back") + "</button>"
    + '<button class="btn primary" id="btnTo2">' + U("au.next") + "</button></div>";
  return h;
}

/* --- 2단계 --- */
function viewSelf(q, s) {
  let h = '<div class="note teal">' + U("sf.notice") + "</div>";

  q.subs.forEach((sub, si) => {
    const b = subBase(q, sub);
    h += '<div class="gsub"><div class="gsub-h"><span>(' + (si + 1) + ") " + esc(subPrompt(q, sub)) + "</span>"
      + '<span class="sub-p">' + U("ex.pts", { n: sub.points }) + "</span></div>";
    h += '<details class="myans"><summary>' + U("sf.myans") + "</summary><pre>"
      + esc(s.answers[sub.id] || U("sf.noans")) + "</pre></details>";
    if (sub.gate) h += '<div class="gate">' + esc(C(b + ".gate", sub.gate.note)) + "</div>";
    if (sub.key) h += '<div class="note red small"><strong>' + U("sf.key") + "</strong> " + esc(C(b + ".key", sub.key)) + "</div>";

    sub.elements.forEach((el, ei) => {
      const key = sub.id + ":" + ei, cur = s.self[key];
      h += '<div class="el"><div class="el-n">' + esc(C(b + ".e" + ei + ".n", el.name)) + "</div>"
        + el.options.map((o, oi) =>
          '<label class="opt' + (cur === oi ? " sel" : "") + '">'
          + '<input type="radio" name="' + q.id + "_" + key + '" data-key="' + key + '" value="' + oi + '"' + (cur === oi ? " checked" : "") + ">"
          + '<span class="opt-p">' + U("ex.pts", { n: o.p }) + "</span>"
          + '<span class="opt-c">' + esc(C(b + ".e" + ei + ".o" + oi, o.cond)) + "</span></label>"
        ).join("") + "</div>";
    });

    (sub.penalties || []).forEach((pn, pi) => {
      const key = sub.id + ":p" + pi;
      h += '<label class="pen' + (s.pen[key] ? " sel" : "") + '">'
        + '<input type="checkbox" data-pen="' + key + '"' + (s.pen[key] ? " checked" : "") + ">"
        + '<span class="opt-p neg">' + U("ex.pts", { n: pn.p }) + "</span>"
        + '<span class="opt-c">' + esc(C(b + ".p" + pi, pn.cond)) + "</span></label>";
    });
    h += "</div>";
  });

  h += '<label class="pen big' + (s.common ? " sel" : "") + '"><input type="checkbox" id="cmPen"' + (s.common ? " checked" : "") + ">"
    + '<span class="opt-p neg">' + U("ex.pts", { n: COMMON_PENALTY.p }) + "</span>"
    + '<span class="opt-c">' + esc(U("cp.cond")) + "</span></label>";

  h += '<div class="livebox"><div class="live-l">' + U("sf.live") + '</div><div class="live-v" id="liveScore">—</div>'
    + '<div class="live-s" id="liveMiss"></div></div>';
  h += '<div class="actions"><button class="btn ghost" id="btnBack1">' + U("sf.back") + "</button>"
    + '<button class="btn primary" id="btnTo3">' + U("sf.next") + "</button></div>";
  return h;
}

function computeSelf(q, s) {
  let total = 0, missing = 0;
  q.subs.forEach(sub => {
    let sum = 0, gateFail = false;
    sub.elements.forEach((el, ei) => {
      const idx = s.self[sub.id + ":" + ei];
      if (idx === undefined) { missing++; return; }
      sum += el.options[idx].p;
      if (sub.gate && sub.gate.elementIndex === ei && el.options[idx].p === sub.gate.failAt) gateFail = true;
    });
    if (gateFail) sum = 0;
    (sub.penalties || []).forEach((pn, pi) => { if (s.pen[sub.id + ":p" + pi]) sum += pn.p; });
    total += Math.max(0, sum);
  });
  if (s.common) total += COMMON_PENALTY.p;
  return { score: Math.max(0, Math.min(20, total)), missing };
}

function subScore(sub, s) {
  let sum = 0, gateFail = false;
  sub.elements.forEach((el, ei) => {
    const idx = s.self[sub.id + ":" + ei];
    if (idx === undefined) return;
    sum += el.options[idx].p;
    if (sub.gate && sub.gate.elementIndex === ei && el.options[idx].p === sub.gate.failAt) gateFail = true;
  });
  if (gateFail) sum = 0;
  (sub.penalties || []).forEach((pn, pi) => { if (s.pen[sub.id + ":p" + pi]) sum += pn.p; });
  return Math.max(0, sum);
}

function refreshLive(q, s) {
  const r = computeSelf(q, s);
  const el = $("#liveScore"); if (!el) return;
  el.textContent = U("ex.score", { a: r.score, b: 20 });
  $("#liveMiss").textContent = r.missing ? U("sf.miss", { n: r.missing }) : U("sf.all");
  $("#liveMiss").className = "live-s" + (r.missing ? " warn" : " ok");
}

/* --- 3단계 --- */
function viewExplain(q, s) {
  let h = '<div class="scorehero"><div class="sh-l">' + U("xp.result", { n: q.no }) + "</div>"
    + '<div class="sh-v">' + s.score + "<span>" + U("xp.of") + "</span></div>"
    + '<div class="sh-b"><i style="width:' + (s.score / 20 * 100) + '%"></i></div>'
    + '<div class="sh-s">' + esc(verdict(s.score)) + "</div></div>";

  h += '<div class="note ink"><strong>' + U("xp.intent") + "</strong> " + esc(C(q.id + ".intent", q.intent)) + "</div>";

  q.subs.forEach((sub, si) => {
    const b = subBase(q, sub), r = subScore(sub, s);
    h += '<div class="gsub"><div class="gsub-h"><span>(' + (si + 1) + ") " + esc(subPrompt(q, sub)) + "</span>"
      + '<span class="sub-p">' + U("ex.score", { a: r, b: sub.points }) + "</span></div>";
    h += '<div class="twocol">'
      + '<div class="col ok"><div class="col-h">' + U("xp.ok") + "</div><ul>"
      + sub.model.ok.map((x, i) => "<li>" + esc(C(b + ".ok." + i, x)) + "</li>").join("") + "</ul></div>"
      + '<div class="col no"><div class="col-h">' + U("xp.no") + "</div><ul>"
      + sub.model.no.map((x, i) => "<li>" + esc(C(b + ".no." + i, x)) + "</li>").join("") + "</ul></div></div>";
    h += '<details class="myans"><summary>' + U("xp.cmp") + "</summary><pre>"
      + esc(s.answers[sub.id] || U("sf.noans")) + "</pre></details></div>";
  });

  const nxt = QUESTIONS.findIndex((x, i) => i > CUR && !STATE[x.id].done);
  h += '<div class="actions"><button class="btn ghost" id="btnBack2">' + U("xp.regrade") + "</button>"
    + '<button class="btn ghost" id="btnRetry">' + U("xp.retry") + "</button>"
    + (nxt >= 0 ? '<button class="btn primary" id="btnNextQ" data-i="' + nxt + '">' + U("xp.next") + "</button>"
               : '<button class="btn primary" id="btnReport2">' + U("xp.report") + "</button>") + "</div>";
  return h;
}

function verdict(sc) {
  return U(sc >= 18 ? "v.18" : sc >= 14 ? "v.14" : sc >= 9 ? "v.9" : sc >= 4 ? "v.4" : "v.0");
}

/* ===== 이벤트 ===== */
function bindStage(q, s) {
  const go = (st) => { s.stage = st; queueSave(); renderQuestion(); };

  $$(".ta", $("#exBody")).forEach(ta => {
    const cnt = $('[data-cnt="' + ta.dataset.sub + '"]', $("#exBody"));
    const upd = () => {
      const n = ta.value.replace(/\s/g, "").length;
      const lines = ta.value.split("\n").filter(x => x.trim()).length;
      cnt.textContent = U("ex.cnt", { c: n, l: lines });
      cnt.className = "ta-c" + (n < 20 ? " low" : "");
    };
    upd();
    ta.oninput = () => { s.answers[ta.dataset.sub] = ta.value; upd(); queueSave(); };
  });

  const b = (id, fn) => { const e = $("#" + id); if (e) e.onclick = fn; };

  b("btnHome2", () => { saveNow(); renderHome(); show("scHome"); });
  b("btnSubmit", () => {
    const empty = q.subs.filter(sub => (s.answers[sub.id] || "").replace(/\s/g, "").length < 10);
    if (empty.length === q.subs.length) return toast(U("ex.needans"), "bad");
    if (empty.length && !confirm(U("ex.confirm", { n: empty.length }))) return;
    s.auto = runAuto(q); go(1);
  });
  b("btnBack0", () => go(0));
  b("btnTo2", () => go(2));
  b("btnBack1", () => go(1));
  b("btnBack2", () => go(2));
  b("btnRetry", () => { s.done = false; s.score = null; go(0); });
  b("btnReport2", () => { saveNow(); renderReport(); show("scReport"); });
  const nq = $("#btnNextQ"); if (nq) nq.onclick = () => { saveNow(); openQuestion(+nq.dataset.i); };

  $$('input[type=radio][data-key]', $("#exBody")).forEach(r => {
    r.onchange = () => {
      s.self[r.dataset.key] = +r.value;
      $$('input[name="' + r.name + '"]').forEach(x => x.closest(".opt").classList.toggle("sel", x.checked));
      refreshLive(q, s); queueSave();
    };
  });
  $$("input[data-pen]", $("#exBody")).forEach(c => {
    c.onchange = () => { s.pen[c.dataset.pen] = c.checked; c.closest(".pen").classList.toggle("sel", c.checked); refreshLive(q, s); queueSave(); };
  });
  const cm = $("#cmPen");
  if (cm) cm.onchange = () => { s.common = cm.checked; cm.closest(".pen").classList.toggle("sel", cm.checked); refreshLive(q, s); queueSave(); };

  if (s.stage === 2) refreshLive(q, s);

  b("btnTo3", () => {
    const r = computeSelf(q, s);
    if (r.missing) return toast(U("sf.needall", { n: r.missing }), "bad");
    s.score = r.score; s.done = true; s.stage = 3;
    saveNow(); renderQuestion();
  });
}

/* ===== 전체 결과 ===== */
function renderReport() {
  const dc = doneCount(), tot = totalScore(), maxed = dc * 20;
  $("#rpTotal").textContent = maxed ? tot + " / " + maxed : tot;
  $("#rpSub").textContent = U("rp.sub", { n: dc }) + (dc < QUESTIONS.length ? U("rp.sub2", { n: QUESTIONS.length - dc }) : "");
  $("#rpPct").textContent = maxed ? Math.round(tot / maxed * 100) + "%" : "—";

  $("#rpBars").innerHTML = QUESTIONS.map(q => {
    const s = STATE[q.id], w = s.done ? s.score / 20 * 100 : 0;
    return '<div class="bar"><div class="bar-l">' + qLabel(q) + " · " + esc(C(q.id + ".title", q.title)) + "</div>"
      + '<div class="bar-t"><i style="width:' + w + '%" class="' + (s.score >= 14 ? "hi" : s.score >= 9 ? "mid" : "lo") + '"></i></div>'
      + '<div class="bar-v">' + (s.done ? U("ex.pts", { n: s.score }) : U("rp.unscored")) + "</div></div>";
  }).join("");

  const weak = [];
  QUESTIONS.forEach(q => {
    const s = STATE[q.id]; if (!s.done) return;
    q.subs.forEach((sub, si) => {
      const r = subScore(sub, s);
      if (r < sub.points * 0.6) weak.push(qLabel(q) + "-(" + (si + 1) + ") " + U("ex.score", { a: r, b: sub.points }));
    });
  });
  $("#rpWeak").innerHTML = weak.length
    ? "<ul>" + weak.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>"
    : '<p class="fine">' + U("rp.noweak") + "</p>";

  $("#rpPrin").innerHTML = prinHTML();
}

function prinHTML() {
  return prins().map(p =>
    '<div class="prin"><div class="prin-n">' + U("pr.n", { n: p.n }) + "</div>"
    + '<div><div class="prin-t">' + esc(p.t) + '</div><div class="prin-d">' + esc(p.d) + "</div></div></div>"
  ).join("");
}

/* ===== 교수자 ===== */
async function renderProf() {
  $("#pfList").innerHTML = '<p class="fine">' + U("pv.load") + "</p>";
  show("scProf");
  try {
    const snap = await db.ref("mockexam/attempts").get();
    const v = snap.val() || {};
    const rows = Object.keys(v).map(k => v[k]).filter(Boolean).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (!rows.length) return ($("#pfList").innerHTML = '<p class="fine">' + U("pv.none") + "</p>");

    const avg = {};
    QUESTIONS.forEach(q => {
      const ss = rows.map(r => r.state && r.state[q.id]).filter(x => x && x.done).map(x => x.score || 0);
      avg[q.id] = ss.length ? (ss.reduce((a, b) => a + b, 0) / ss.length).toFixed(1) + " (" + U("pv.persons", { n: ss.length }) + ")" : "—";
    });
    const langName = (l) => (LANGS.find(x => x.id === l) || { label: "—" }).label;

    $("#pfList").innerHTML =
      '<div class="pfstat"><div>' + U("pv.n", { n: "<b>" + rows.length + "</b>" }) + "</div>"
      + QUESTIONS.map(q => "<div>" + U("pv.avg", { n: q.no }) + " <b>" + avg[q.id] + "</b></div>").join("") + "</div>"
      + '<table class="dt wide"><thead><tr><th>' + U("pv.sno") + "</th><th>" + U("pv.name") + "</th><th>" + U("pv.lang")
      + "</th><th>" + U("pv.done") + "</th>"
      + QUESTIONS.map(q => "<th>" + q.no + "</th>").join("") + "<th>" + U("pv.sum") + "</th><th>" + U("pv.last") + "</th></tr></thead><tbody>"
      + rows.map(r => "<tr><td>" + esc(r.studentNo || "—") + "</td><td>" + esc(r.name || "—") + "</td>"
        + "<td>" + esc(langName(r.lang || "ko")) + "</td>"
        + "<td class='num'>" + (r.doneCount || 0) + "</td>"
        + QUESTIONS.map(q => { const s = r.state && r.state[q.id]; return "<td class='num'>" + (s && s.done ? s.score : "·") + "</td>"; }).join("")
        + "<td class='num'><b>" + (r.total || 0) + "</b></td>"
        + "<td>" + (r.updatedAt ? new Date(r.updatedAt).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—") + "</td></tr>").join("")
      + "</tbody></table>";
  } catch (e) {
    $("#pfList").innerHTML = '<p class="fine">' + U("pv.fail") + "</p>";
  }
}

/* ===== 부팅 ===== */
function boot() {
  let saved = "ko";
  try { saved = localStorage.getItem("mockexam.lang") || ""; } catch (e) {}
  if (!saved) {
    /* 첫 방문 기본값은 한국어. 중국어권 브라우저만 중국어로 시작하고,
       나머지는 상단 메뉴에서 한 번 고르면 그 선택이 기억된다. */
    const n = (navigator.language || "ko").toLowerCase();
    saved = n.startsWith("zh") ? "zh" : "ko";
  }
  LANG = TRS[saved] ? saved : "ko";

  $("#tabLogin").onclick = () => setAuthTab("login");
  $("#tabJoin").onclick = () => setAuthTab("join");
  $("#btnEmail").onclick = doEmailAuth;
  $("#btnEmail").dataset.mode = "login";
  $("#btnGoogle").onclick = doGoogle;
  $("#inPw").onkeydown = e => { if (e.key === "Enter") doEmailAuth(); };

  $("#langBtn").onclick = (e) => { e.stopPropagation(); $("#langWrap").classList.toggle("open"); };
  document.addEventListener("click", () => $("#langWrap").classList.remove("open"));

  $("#btnStart").onclick = () => {
    const nxt = QUESTIONS.findIndex(q => !STATE[q.id].done);
    openQuestion(nxt < 0 ? 0 : nxt);
  };
  $("#btnReport").onclick = () => { renderReport(); show("scReport"); };
  $("#rpHome").onclick = () => { renderHome(); show("scHome"); };
  $("#topHome").onclick = () => { if (!ME) return; saveNow(); renderHome(); show("scHome"); };
  $("#profLink").onclick = renderProf;
  $("#pfHome").onclick = () => { renderHome(); show("scHome"); };
  $$(".btnOut").forEach(b => b.onclick = () => auth.signOut());
  $("#btnPrin").onclick = () => { $("#prinBody").innerHTML = prinHTML(); $("#prinModal").classList.add("on"); };
  $("#prinClose").onclick = () => $("#prinModal").classList.remove("on");
  $("#prinModal").onclick = (e) => { if (e.target.id === "prinModal") $("#prinModal").classList.remove("on"); };

  setLang(LANG, false);

  auth.onAuthStateChanged(async user => {
    if (!user) { ME = null; $("#topHome").style.display = "none"; show("scAuth"); return; }
    show("scLoad");
    try {
      const p = await ensureProfile(user);
      ME = { uid: user.uid, email: user.email, name: p.name, studentNo: p.studentNo };
      await db.ref("mockexam/users/" + user.uid).update({ lastSeen: Date.now() });
      await loadProgress();
      $("#topHome").style.display = "";
      renderHome(); show("scHome");
    } catch (e) {
      show("scAuth");
      $("#authMsg").textContent = U("auth.loadfail");
    }
  });
}
document.addEventListener("DOMContentLoaded", boot);

</script>
